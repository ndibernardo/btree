name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test / Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.98.0"
          - stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Rust ${{ matrix.rust }}
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Test all targets
        run: cargo +${{ matrix.rust }} test --all-targets
      - name: Test documentation
        run: cargo +${{ matrix.rust }} test --doc

  quality:
    name: Format, lint, and document
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install quality toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component clippy --component rustfmt
      - name: Check formatting
        run: cargo +1.98.0 fmt --check
      - name: Lint all targets
        run: cargo +1.98.0 clippy --all-targets -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.98.0 doc --no-deps
